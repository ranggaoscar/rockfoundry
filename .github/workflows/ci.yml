name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for test repos
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Lint
        run: |
          uv run --project engine ruff check .
          uv run --project engine ruff format --check .
      - name: Engine tests
        run: uv run --project engine pytest engine/tests -q
      - name: Plugin tests
        run: uv run --project engine --with fastapi --with httpx pytest hermes-plugin/tests -q -p no:cacheprovider
