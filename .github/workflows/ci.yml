name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  # ── Current local-first quality gates ─────────────────────
  quality:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER_MODE: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure isolated SQLite
        run: |
          data_dir="$RUNNER_TEMP/rockfoundry-quality-data"
          echo "ROCKFOUNDRY_DATA_DIR=$data_dir" >> "$GITHUB_ENV"
          echo "ROCKFOUNDRY_DATABASE_URL=file:$data_dir/rockfoundry.db" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply SQLite migrations
        run: pnpm db:migrate

      - name: Format check
        # Known repository-wide formatting drift is tracked separately. Do not
        # mass-format unrelated files or make it hide the functional gates.
        run: pnpm format:check
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

  # ── Unit tests and visible product evals ──────────────────
  test:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER_MODE: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure isolated SQLite
        run: |
          data_dir="$RUNNER_TEMP/rockfoundry-test-data"
          echo "ROCKFOUNDRY_DATA_DIR=$data_dir" >> "$GITHUB_ENV"
          echo "ROCKFOUNDRY_DATABASE_URL=file:$data_dir/rockfoundry.db" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply SQLite migrations
        run: pnpm db:migrate

      - name: Build core package
        run: pnpm --filter @rockfoundry/core build

      - name: Build AI package
        run: pnpm --filter @rockfoundry/ai build

      - name: Build database package
        run: pnpm --filter @rockfoundry/db build

      - name: Run tests
        run: pnpm test

      - name: Run CRM invention eval
        run: pnpm eval:invention

      - name: Run cross-domain generalization eval
        run: pnpm eval:generalization

  # ── E2E tests against isolated local SQLite ───────────────
  e2e:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER_MODE: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure isolated SQLite
        run: |
          data_dir="$RUNNER_TEMP/rockfoundry-e2e-data"
          echo "ROCKFOUNDRY_DATA_DIR=$data_dir" >> "$GITHUB_ENV"
          echo "ROCKFOUNDRY_DATABASE_URL=file:$data_dir/rockfoundry.db" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply SQLite migrations
        run: pnpm db:migrate

      - name: Build core package
        run: pnpm --filter @rockfoundry/core build

      - name: Build AI package
        run: pnpm --filter @rockfoundry/ai build

      - name: Build database package
        run: pnpm --filter @rockfoundry/db build

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

  # ── AI smoke test (manual only) ───────────────────────────
  ai-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run AI smoke test
        run: pnpm ai:smoke
        env:
          AI_PROVIDER_MODE: 9router
          NINE_ROUTER_BASE_URL: ${{ secrets.NINE_ROUTER_BASE_URL }}
          NINE_ROUTER_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          NINE_ROUTER_DEFAULT_MODEL: ${{ secrets.NINE_ROUTER_DEFAULT_MODEL || 'gpt-4o' }}
          NINE_ROUTER_CHEAP_MODEL: ${{ secrets.NINE_ROUTER_CHEAP_MODEL || 'gpt-4o-mini' }}
          NINE_ROUTER_STRONG_MODEL: ${{ secrets.NINE_ROUTER_STRONG_MODEL || 'gpt-4o' }}
