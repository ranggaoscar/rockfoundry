services:
  # ── PostgreSQL Database ──────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: rockfoundry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rockfoundry

  # ── MinIO (S3-compatible storage for exports) ──────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - rockfoundry

  # ── Web Application ──────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/rockfoundry?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-mock}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_DEFAULT_MODEL: ${NINE_ROUTER_DEFAULT_MODEL:-gpt-4o}
      NINE_ROUTER_CHEAP_MODEL: ${NINE_ROUTER_CHEAP_MODEL:-gpt-4o-mini}
      NINE_ROUTER_STRONG_MODEL: ${NINE_ROUTER_STRONG_MODEL:-gpt-4o}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: /app/data/exports
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
    volumes:
      - exportdata:/app/data
    networks:
      - rockfoundry

volumes:
  pgdata:
  miniodata:
  exportdata:

networks:
  rockfoundry:
    driver: bridge
