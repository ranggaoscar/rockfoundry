# RF-002D operator delta for the FIXED base Compose used by rockfoundry-deploy.
# Merge only into service `web`; keep its single literal image: rockfoundry-web:<tag>
# line intact for the fixed wrapper's exact-image pinning logic. This delta must not
# declare another image or migration service/image.
# Apply only behind the existing root-owned approval marker + origin/main SHA gate.
services:
  web:
    build:
      context: /opt/rockfoundry/repo
      dockerfile: deployment/Dockerfile.work-os
    env_file:
      # Owner-protected OAuth/runtime values and provisioned private Hermes API values.
      - path: ../config/runtime.env
        required: true
      - path: /opt/hermes-agent/home/profiles/rockfoundry/client.env
        required: true
    environment:
      NODE_ENV: "production"
      NEXTAUTH_URL: "https://foundry.rockbase.web.id"
      ROCKFOUNDRY_OWNER_EMAILS: "ranggaoscar@gmail.com"
      ROCKFOUNDRY_WORK_ORIGIN: "https://foundry.rockbase.web.id"
      HERMES_EXECUTOR_ENABLED: "true"
      HERMES_EXECUTOR_PRIVATE_HTTP_ORIGIN: "http://192.168.16.1:8643"
