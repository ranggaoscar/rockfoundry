[project]
name = "rockfoundry"
version = "2.0.0"
description = "Project memory for builders who work with AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rockfoundry = "rockfoundry.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rockfoundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
